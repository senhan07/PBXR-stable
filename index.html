<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PBXR - Manage your monitoring targets</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { 
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              background: '#050507', 
              surface: '#0f0f11',
              border: '#27272a',
              primary: '#3b82f6', // Brighter Blue
              secondary: '#6366f1',
              success: '#10b981',
              danger: '#ef4444',
            },
            animation: {
              'fade-in': 'fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
              'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            },
            boxShadow: {
              'glow': '0 0 20px -5px rgba(59, 130, 246, 0.3)',
            }
          }
        }
      }
    </script>
    <style>
      body { 
        background-color: #050507;
        /* Subtle noise texture over gradient */
        background-image: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #050507 60%);
        min-height: 100vh;
        color: #f4f4f5;
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      }
      
      #root {
        position: relative;
        z-index: 1;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #52525b; }

      /* Form Reset */
      input:focus, textarea:focus {
        outline: none;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
      }
      
      /* Utilities */
      .glass-panel {
        background: rgba(15, 15, 17, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
    </style>
</head>
  <body class="antialiased selection:bg-blue-500/30 selection:text-blue-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
