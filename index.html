<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PBXR - Manage your monitoring targets</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body { 
        background-color: #050507;
        /* Subtle noise texture over gradient */
        background-image: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #050507 60%);
        min-height: 100vh;
        color: #f4f4f5;
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        font-size: 0.9rem;
      }
      
      #root {
        position: relative;
        z-index: 1;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #52525b; }

      /* Form Reset */
      input:focus, textarea:focus {
        outline: none;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
      }
      
      /* Utilities */
      .glass-panel {
        background: rgba(15, 15, 17, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
    </style>
</head>
  <body class="antialiased selection:bg-blue-500/30 selection:text-blue-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
